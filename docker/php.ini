; Réglages PHP du conteneur de développement.
;
; Contexte : le dossier du projet est monté depuis Windows (`.:/app`). Sur
; Docker Desktop, chaque accès au système de fichiers de ce montage coûte
; environ 8 ms, contre 0,01 ms sur le disque du conteneur — 780 fois plus.
; Le démarrage de Laravel touchant des milliers de fichiers, une page mettait
; plus de deux secondes alors qu'elle ne fait presque rien.
;
; La parade est de ne plus relire ces fichiers à chaque requête.

[opcache]
opcache.enable = 1

; `artisan serve` est un processus CLI : sans cette ligne, OPcache est inactif
; pour le serveur de développement et tout est recompilé à chaque requête.
; C'est le réglage qui change tout ici.
opcache.enable_cli = 1

opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32

; Laravel + Testbench + les dépendances dépassent largement la valeur par
; défaut (10 000). Un dépassement ferait silencieusement retomber dans la
; recompilation permanente.
opcache.max_accelerated_files = 30000

; On garde la détection des modifications — c'est un environnement de
; développement — mais on ne vérifie la date d'un fichier qu'une fois toutes
; les deux secondes au lieu d'à chaque requête. Une modification du code
; apparaît donc avec deux secondes de retard au pire, et le coûteux `stat` sur
; le montage Windows disparaît des requêtes suivantes.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Cache disque en complément du cache mémoire : il survit au redémarrage du
; serveur, et vit sur le disque du conteneur, pas sur le montage.
opcache.file_cache = /tmp/opcache
opcache.file_cache_consistency_checks = 1

; Résolution des chemins : même logique, on évite de reparcourir l'arborescence
; du montage pour retrouver un fichier déjà vu.
realpath_cache_size = 16384K
realpath_cache_ttl = 600

; Confort de développement : les traces d'erreur restent lisibles.
memory_limit = 512M
